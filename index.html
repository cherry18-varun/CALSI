<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <!-- Link external CSS stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main container to center the calculator on the screen -->
  <div class="calculator-container">
    <main class="calculator" role="region" aria-label="Calculator">
      
      <!-- Screen / Display Section -->
      <div class="display">
        <!-- Shows previous operand and chosen operator (e.g., "12 +") -->
        <div class="previous-operand" id="previousOperand" aria-live="polite"></div>
        <!-- Shows current number being typed or the computed result -->
        <div class="current-operand" id="currentOperand" aria-live="polite">0</div>
      </div>

      <!-- Buttons Grid Layout -->
      <div class="buttons-grid">
        <!-- Row 1: Utility actions & Division -->
        <button type="button" class="btn btn-action" data-action="clear" aria-label="All Clear">AC</button>
        <button type="button" class="btn btn-action" data-action="toggle-sign" aria-label="Toggle Positive/Negative">+/-</button>
        <button type="button" class="btn btn-action" data-action="percent" aria-label="Percent">%</button>
        <button type="button" class="btn btn-operator" data-operation="÷" aria-label="Divide">÷</button>

        <!-- Row 2: Numbers 7-9 & Multiplication -->
        <button type="button" class="btn btn-number" data-number="7">7</button>
        <button type="button" class="btn btn-number" data-number="8">8</button>
        <button type="button" class="btn btn-number" data-number="9">9</button>
        <button type="button" class="btn btn-operator" data-operation="×" aria-label="Multiply">×</button>

        <!-- Row 3: Numbers 4-6 & Subtraction -->
        <button type="button" class="btn btn-number" data-number="4">4</button>
        <button type="button" class="btn btn-number" data-number="5">5</button>
        <button type="button" class="btn btn-number" data-number="6">6</button>
        <button type="button" class="btn btn-operator" data-operation="-" aria-label="Subtract">−</button>

        <!-- Row 4: Numbers 1-3 & Addition -->
        <button type="button" class="btn btn-number" data-number="1">1</button>
        <button type="button" class="btn btn-number" data-number="2">2</button>
        <button type="button" class="btn btn-number" data-number="3">3</button>
        <button type="button" class="btn btn-operator" data-operation="+" aria-label="Add">+</button>

        <!-- Row 5: 0 (spans 2 columns), Decimal dot, Equals -->
        <button type="button" class="btn btn-number btn-zero" data-number="0">0</button>
        <button type="button" class="btn btn-number" data-action="decimal" aria-label="Decimal point">.</button>
        <button type="button" class="btn btn-operator btn-equals" data-action="calculate" aria-label="Equals">=</button>
      </div>

    </main>
  </div>

  <!-- Link external JavaScript file (loaded at the end of body so HTML parses first) -->
  <script src="script.js"></script>
</body>
</html>
